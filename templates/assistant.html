<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 助手 · 生产质量数据分析工具</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; background: #f5f6f8; color: #1f2329;
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif; font-size: 14px;
  }
  header {
    background: #fff; border-bottom: 1px solid #e8eaee; padding: 12px 20px;
    display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px;
  }
  header h1 { font-size: 16px; margin: 0; }
  .who { font-size: 12px; color: #6b7280; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .tag { background: #eef3ff; color: #2a6df5; border-radius: 10px; padding: 2px 9px; }
  .tag.role-admin { background: #e8f5e9; color: #1b7f3b; }
  .tag.role-inspector { background: #eef3ff; color: #2a6df5; }
  .tag.role-viewer { background: #f2f3f5; color: #6b7280; }
  main { max-width: 860px; margin: 18px auto 60px; padding: 0 16px; }
  .panel { background: #fff; border-radius: 10px; padding: 16px 18px; box-shadow: 0 2px 10px rgba(0,0,0,.05); margin-bottom: 14px; }
  textarea {
    width: 100%; min-height: 74px; padding: 10px 12px; font-size: 14px; font-family: inherit;
    border: 1px solid #d9dde3; border-radius: 8px; resize: vertical; outline: none;
  }
  textarea:focus { border-color: #2a6df5; }
  .row { display: flex; align-items: center; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
  button {
    padding: 8px 18px; font-size: 14px; color: #fff; background: #2a6df5;
    border: 0; border-radius: 6px; cursor: pointer;
  }
  button.ghost { background: #f2f3f5; color: #4b5563; }
  button:disabled { background: #9db8f0; cursor: not-allowed; }
  .examples { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .examples span {
    font-size: 12px; color: #2a6df5; background: #f2f6ff; border: 1px solid #dbe6ff;
    border-radius: 14px; padding: 3px 10px; cursor: pointer;
  }
  .meta { font-size: 12px; color: #8a9099; margin-top: 6px; }
  .answer { white-space: pre-wrap; line-height: 1.7; }
  .badge { font-size: 11px; padding: 2px 7px; border-radius: 9px; margin-right: 8px; }
  .badge.llm { background: #e8f5e9; color: #1b7f3b; }
  .badge.offline { background: #fff6e5; color: #a86a00; }
  .badge.fallback { background: #fdecea; color: #b3261e; }
  .notice { font-size: 12px; color: #a86a00; background: #fffaf0; border-left: 3px solid #f0b429; padding: 7px 10px; margin-bottom: 10px; }
  .calls { margin-top: 10px; }
  .calls table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  .calls th, .calls td { text-align: left; padding: 5px 8px; border-bottom: 1px solid #eef0f3; }
  .calls th { color: #6b7280; font-weight: 500; }
  details { margin-top: 10px; font-size: 12.5px; }
  details pre { background: #f7f8fa; border-radius: 6px; padding: 10px; overflow: auto; max-height: 280px; }
  .perms { font-size: 12px; color: #6b7280; }
  .empty { color: #8a9099; font-size: 13px; }
  a.link { color: #2a6df5; text-decoration: none; font-size: 12px; }
</style>
</head>
<body>
<header>
  <h1>AI 助手 · 生产质量数据分析</h1>
  <div class="who" id="who"></div>
</header>

<main>
  <div class="panel">
    <textarea id="question" placeholder="例如：批次 B001 的良率是多少？"></textarea>
    <div class="row">
      <button id="ask">提问</button>
      <button class="ghost" id="logout">退出登录</button>
      <span class="meta" id="hint">助手只依据数据库真实数据作答</span>
    </div>
    <div class="examples">
      <span>整体质量情况怎么样？</span>
      <span>各批次良率如何？</span>
      <span>不良分布情况</span>
      <span>当前有多少未关闭异常？</span>
      <span>标注进度如何？</span>
      <span>最近 7 天的检验记录</span>
    </div>
  </div>

  <div class="panel" id="result">
    <div class="empty">还没有提问。上面输入问题后点「提问」。</div>
  </div>
</main>

<script>
  const TOKEN_KEY = 'xm02_token';
  const IDENTITY_KEY = 'xm02_identity';

  const who = document.getElementById('who');
  const result = document.getElementById('result');
  const askBtn = document.getElementById('ask');
  const questionEl = document.getElementById('question');

  function token() { return localStorage.getItem(TOKEN_KEY); }

  function identity() {
    try { return JSON.parse(localStorage.getItem(IDENTITY_KEY) || 'null'); }
    catch (e) { return null; }
  }

  function renderWho() {
    const me = identity();
    if (!me) {
      who.innerHTML = '<span>未登录</span><a class="link" href="/login">去登录</a>';
      askBtn.disabled = true;
      return;
    }
    const cls = 'tag role-' + me.role;
    who.innerHTML =
      '<span class="' + cls + '">' + me.role_label + '</span>' +
      '<span>' + me.username + '</span>' +
      '<span class="perms">可操作：' + (me.permission_labels || []).join(' / ') + '</span>' +
      '<a class="link" href="/dashboard">质量看板</a>' +
      '<a class="link" href="/annotation">图像标注</a>';
    askBtn.disabled = false;
  }

  function escapeHtml(text) {
    return String(text).replace(/[&<>"']/g, function (ch) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch];
    });
  }

  function renderAnswer(body) {
    const badgeClass = body.mode === 'llm' ? 'llm'
      : (body.mode === 'offline_fallback' ? 'fallback' : 'offline');
    const modeLabel = body.mode === 'llm' ? '大模型模式'
      : (body.mode === 'offline_fallback' ? '降级：本地直查' : '离线模式：本地直查');

    let html = '';
    if (body.notice) {
      html += '<div class="notice">' + escapeHtml(body.notice) + '</div>';
    }
    html += '<div><span class="badge ' + badgeClass + '">' + modeLabel + '</span>'
      + '<span class="meta">提问人：' + escapeHtml(body.asked_by || '-')
      + '（' + escapeHtml(body.role || '-') + '）</span></div>';
    html += '<div class="answer">' + escapeHtml(body.answer || '') + '</div>';

    const calls = body.tool_calls || [];
    if (calls.length) {
      html += '<div class="calls"><table><tr><th>#</th><th>调用工具</th><th>参数</th><th>返回行数</th></tr>';
      calls.forEach(function (call, index) {
        html += '<tr><td>' + (index + 1) + '</td><td>' + escapeHtml(call.tool)
          + '</td><td>' + escapeHtml(JSON.stringify(call.params || {}))
          + '</td><td>' + (call.row_count == null ? '-' : call.row_count)
          + (call.error ? ' ⚠️ ' + escapeHtml(call.error) : '') + '</td></tr>';
      });
      html += '</table></div>';
    }

    if (body.data && body.data.length) {
      html += '<details><summary>查看数据库原始返回（可核查）</summary><pre>'
        + escapeHtml(JSON.stringify(body.data, null, 2)) + '</pre></details>';
    }

    result.innerHTML = html;
  }

  async function ask() {
    const question = questionEl.value.trim();
    if (!question) { return; }
    if (!token()) {
      result.innerHTML = '<div class="notice">请先登录：<a class="link" href="/login">/login</a></div>';
      return;
    }

    askBtn.disabled = true;
    result.innerHTML = '<div class="empty">查询中…</div>';
    try {
      const resp = await fetch('/api/assistant/ask', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + token()
        },
        body: JSON.stringify({ question: question })
      });
      const data = await resp.json();
      if (resp.status === 401) {
        result.innerHTML = '<div class="notice">登录已过期，请重新登录：<a class="link" href="/login">/login</a></div>';
        return;
      }
      if (!resp.ok) {
        result.innerHTML = '<div class="notice">请求失败：' + escapeHtml(data.error || resp.status) + '</div>';
        return;
      }
      renderAnswer(data);
    } catch (err) {
      result.innerHTML = '<div class="notice">网络错误：' + escapeHtml(err) + '</div>';
    } finally {
      askBtn.disabled = false;
    }
  }

  askBtn.addEventListener('click', ask);
  document.querySelectorAll('.examples span').forEach(function (el) {
    el.addEventListener('click', function () { questionEl.value = el.textContent; });
  });
  document.getElementById('logout').addEventListener('click', function () {
    localStorage.removeItem(TOKEN_KEY);
    localStorage.removeItem(IDENTITY_KEY);
    location.href = '/login';
  });
  questionEl.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) ask();
  });

  renderWho();
</script>
</body>
</html>
